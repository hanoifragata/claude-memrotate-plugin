name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Acciones fijadas por commit (SHA) y runners por version, no "latest".
# Dependabot (.github/dependabot.yml) propone las actualizaciones de las acciones.

jobs:
  test:
    name: ${{ matrix.os }} / Python 3.13
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Show interpreters
        shell: bash
        run: |
          python --version
          command -v pwsh && pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()' || echo "pwsh not installed"
          command -v powershell && powershell -NoProfile -Command '$PSVersionTable.PSVersion.ToString()' || true

      - name: Tests
        run: python tests/run_tests.py

  macos-system-python:
    # El Python que trae macOS de serie (Command Line Tools, 3.9): la version mas antigua habitual
    name: macos-15 / system Python
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tests
        run: |
          /usr/bin/python3 --version
          /usr/bin/python3 tests/run_tests.py
